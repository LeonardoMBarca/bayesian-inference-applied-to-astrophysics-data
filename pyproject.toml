[project]
name = "bayesian-inference-applied-to-astrophysics-data"
version = "0.2.0"
description = "Traceable RAW/Silver/Gold astrophysics pipeline and Bayesian transit validation"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { file = "LICENSE" }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
